name: Windows

on:
  push:
    branches: [ dev ]
    paths-ignore:
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
  workflow_dispatch:
    inputs:
      config:
        description: Build configuration (release is uploaded to a GitHub release, debug to an artifact)
        type: choice
        options: [ release, debug ]
        default: release
      arch:
        description: Target architectures, comma separated (x64, x64_x86, arm64)
        type: string
        default: x64

concurrency:
  group: win-${{ github.ref }}-${{ inputs.arch || 'x64' }}-${{ inputs.config || 'release' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      config: ${{ steps.matrix.outputs.config }}

    steps:
      - name: Build matrix.
        id: matrix
        env:
          INPUT_ARCH: ${{ inputs.arch || 'x64' }}
          INPUT_CONFIG: ${{ inputs.config || 'release' }}
        run: |
          case "$INPUT_CONFIG" in
            release|debug) ;;
            *) echo "::error::Unknown config '$INPUT_CONFIG'"; exit 1 ;;
          esac
          matrix='[]'
          for arch in $(echo "$INPUT_ARCH" | tr ',' ' '); do
            case "$arch" in
              x64|x64_x86) runner=windows-latest; toolset=14.44 ;;
              arm64) runner=windows-11-arm; toolset= ;;
              *) echo "::error::Unknown arch '$arch'"; exit 1 ;;
            esac
            matrix=$(echo "$matrix" | jq -c --arg arch "$arch" --arg runner "$runner" --arg toolset "$toolset" \
              'if any(.[]; .arch == $arch) then . else . + [{arch: $arch, runner: $runner, toolset: $toolset}] end')
          done
          if [ "$matrix" = '[]' ]; then
            echo "::error::No architectures selected"; exit 1
          fi
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "config=$INPUT_CONFIG" >> $GITHUB_OUTPUT

      # Created once here, every architecture then uploads its own asset.
      - name: Create release.
        if: steps.matrix.outputs.config == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: win-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Windows build ${{ github.run_number }} (${{ github.sha }})
          body: |
            Release build of `${{ github.sha }}` from `${{ github.ref_name }}`.
          prerelease: true

  windows:
    name: Windows ${{ matrix.arch }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      # Not CONFIG: pacman-key in the msys2 stage reads that variable.
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_KIND: ${{ needs.setup.outputs.config }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
          # Build on the drive with the most free space, the C: drive alone
          # is not enough for libraries plus the Telegram build tree.
          $drive = Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Name.Length -eq 1 -and $_.Free } |
            Sort-Object Free -Descending | Select-Object -First 1
          $target = "$($drive.Name):\TBuild"
          Write-Host "Using $target"
          New-Item -ItemType Directory -Force "$target\Libraries" | Out-Null
          cmd /c mklink /d "$env:GITHUB_WORKSPACE\TBuild" "$target"

          $libs = "$env:GITHUB_WORKSPACE\TBuild\Libraries"
          if ($env:BUILD_ARCH -eq 'x64') { $libs += '\win64' }
          "TBUILD=$env:GITHUB_WORKSPACE\TBuild" >> $env:GITHUB_ENV
          "LibrariesPath=$libs" >> $env:GITHUB_ENV

          # Debug builds skip the release libraries, so the caches differ.
          $suffix = if ($env:BUILD_KIND -eq 'release') { '-release' } else { '' }
          "CACHE_PREFIX=$env:RUNNER_OS-$env:BUILD_ARCH$suffix" >> $env:GITHUB_ENV
          "PREPARE_ARGS=$(if ($env:BUILD_KIND -eq 'release') { 'silent' } else { 'skip-release silent' })" >> $env:GITHUB_ENV
          "BUILD_CONFIG=$(if ($env:BUILD_KIND -eq 'release') { 'Release' } else { 'Debug' })" >> $env:GITHUB_ENV
          $configureArch = switch ($env:BUILD_ARCH) { 'x64_x86' { 'x86' } 'arm64' { 'arm' } default { 'x64' } }
          "CONFIGURE_ARCH=$configureArch" >> $env:GITHUB_ENV
          "CONFIGURE_EXTRA=$(if ($env:BUILD_KIND -eq 'release') { '' } else { '-D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=' })" >> $env:GITHUB_ENV

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: env.BUILD_ARCH == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - name: Native Tools Command Prompt.
        uses: rzlamrr/msvc-dev-cmd@v2
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ matrix.toolset }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ env.CACHE_PREFIX }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_PREFIX }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ env.CACHE_PREFIX }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_PREFIX }}-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ env.CACHE_PREFIX }}-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_PREFIX }}-qt-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat %PREPARE_ARGS%

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      # Saved right after the libraries are ready, so a failing build
      # does not throw the libraries away.
      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ env.CACHE_PREFIX }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ env.CACHE_PREFIX }}-libs-v2-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ env.CACHE_PREFIX }}-qt-${{ env.CACHE_KEY }}

      - name: AyuGram Desktop build.
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          if "%API_ID%"=="" set API_ID=2040
          if "%API_HASH%"=="" set API_HASH=b18441a1ff607e10a989891a5462e627

          call configure.bat ^
          %CONFIGURE_ARCH% ^
          -D TDESKTOP_API_ID=%API_ID% ^
          -D TDESKTOP_API_HASH=%API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=%BUILD_CONFIG% ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          %CONFIGURE_EXTRA%

          cmake --build ..\out --config %BUILD_CONFIG% --parallel

      - name: Move artifact.
        shell: pwsh
        run: |
          $out = "$env:TBUILD\$env:REPO_NAME\out\$env:BUILD_CONFIG"
          New-Item -ItemType Directory artifact | Out-Null
          Move-Item "$out\AyuGram.exe" artifact\
          if (Test-Path "$out\Updater.exe") { Move-Item "$out\Updater.exe" artifact\ }
          if ($env:BUILD_KIND -eq 'release') {
            $zip = "AyuGram-win-$env:BUILD_ARCH.zip"
            Compress-Archive -Path artifact\* -DestinationPath $zip
            "RELEASE_ASSET=$zip" >> $env:GITHUB_ENV
          }

      - name: Upload artifact (debug).
        if: env.BUILD_KIND == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-win-${{ env.BUILD_ARCH }}-debug
          path: artifact
          if-no-files-found: error

      - name: Upload to release.
        if: env.BUILD_KIND == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: win-build-${{ github.run_number }}
          files: ${{ env.RELEASE_ASSET }}
          fail_on_unmatched_files: true
